# 학기별 과목 목록(courses/<학기>.json)을 만든다. 앱의 시간표 과목 검색이 지난 학기·계절학기를 볼 때 쓴다.
# 지난 학기는 바뀌지 않아 한 번만 만들면 된다 — 이미 있는 학기는 건너뛴다. 손으로 돌린다("Run workflow").
# 이번 학기는 rooms.yml이 매달 다시 만든다. 학기마다 3천 번씩 강의계획서를 받아서 오래 걸린다(정규 학기당 5분 안팎).
name: 학기별 과목 목록

on:
  workflow_dispatch:
    inputs:
      from_year:
        description: "몇 년부터"
        default: "2019"
      force:
        description: "있는 학기도 다시 만들기(1)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: rooms
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/make_rooms_json.py catalog ${{ inputs.from_year }} courses
        env:
          FORCE: ${{ inputs.force }}
        continue-on-error: true   # 중간에 끊겨도 만든 학기는 올린다
      - name: 올리기
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses
          if git diff --cached --quiet; then echo "바뀐 것 없음"; else git commit -m "학기별 과목 목록" && git pull --rebase origin main && git push origin HEAD:main; fi
